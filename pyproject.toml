[project]
name = "model"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flash-linear-attention>=0.5.0",
    "gigatoken>=0.10.0",
    "huggingface-hub[hf-transfer]>=1.25.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pyarrow>=25.0.0",
    "pymupdf>=1.28.0",
    "pypdf>=6.14.2",
    "tokenizers>=0.23.1",
    "torch>=2.13.0",
    "zstandard>=0.25.0",
]

[tool.uv]
torch-backend = "auto"
# WSL-only sandbox: don't resolve wheels for other platforms
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = [
    "jax>=0.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
# Repo root on sys.path so tests can `from model.losses import ...`.
# The project is a research sandbox, not a distributed package — no src/ layout.
pythonpath = ["."]
testpaths = ["tests"]
